<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="AI-Factory invents, builds, and ships products">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#122033"/>
      <stop offset="100%" stop-color="#0e1a14"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="35%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <circle cx="980" cy="90" r="120" fill="#14b8a6" opacity="0.08" filter="url(#soft)"/>
  <circle cx="180" cy="340" r="90" fill="#38bdf8" opacity="0.07" filter="url(#soft)"/>

  <!-- Factory node -->
  <rect x="70" y="120" width="220" height="180" rx="18" fill="#152238" stroke="#2a3f5f"/>
  <text x="180" y="168" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">AI-Factory</text>
  <text x="180" y="200" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">idea ’ spec ’ code</text>
  <text x="180" y="222" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">QA ’ deploy ’ live</text>
  <rect x="100" y="250" width="160" height="28" rx="8" fill="#0f766e"/>
  <text x="180" y="269" text-anchor="middle" fill="#ecfdf5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">invents &amp; builds</text>

  <path d="M300 210 H430" stroke="url(#line)" stroke-width="3" fill="none"/>
  <polygon points="430,210 418,204 418,216" fill="#5eead4"/>

  <!-- Product cards -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="450" y="95" width="280" height="100" rx="14" fill="#152238" stroke="#334155"/>
    <text x="470" y="128" fill="#5eead4" font-size="12" font-weight="600">PRODUCT</text>
    <text x="470" y="158" fill="#f8fafc" font-size="20" font-weight="700">Sentinel</text>
    <text x="470" y="180" fill="#94a3b8" font-size="13">Verified safety companion</text>

    <rect x="450" y="225" width="280" height="100" rx="14" fill="#152238" stroke="#334155"/>
    <text x="470" y="258" fill="#5eead4" font-size="12" font-weight="600">PRODUCT</text>
    <text x="470" y="288" fill="#f8fafc" font-size="20" font-weight="700">Relay</text>
    <text x="470" y="310" fill="#94a3b8" font-size="13">Verified handoff desk</text>
  </g>

  <path d="M740 210 H860" stroke="url(#line)" stroke-width="3" fill="none"/>
  <polygon points="860,210 848,204 848,216" fill="#5eead4"/>

  <!-- Catalog -->
  <rect x="870" y="120" width="270" height="180" rx="18" fill="#10261f" stroke="#1f6b57"/>
  <text x="1005" y="168" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">aicom-products</text>
  <text x="1005" y="200" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">full source · live demos</text>
  <text x="1005" y="222" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">not scaffolds  shipped apps</text>
  <rect x="920" y="250" width="170" height="28" rx="8" fill="#134e4a"/>
  <text x="1005" y="269" text-anchor="middle" fill="#ccfbf1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">factory catalog</text>

  <text x="600" y="390" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
    Products conceived and built by the factory  published here on demand.
  </text>
</svg>
