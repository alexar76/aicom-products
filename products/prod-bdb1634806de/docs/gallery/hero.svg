<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="Sentinel — location to signed safety receipt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/><stop offset="100%" stop-color="#10261f"/>
    </linearGradient>
  </defs>
  <rect width="960" height="360" fill="url(#bg)"/>
  <text x="48" y="64" fill="#e2e8f0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="700">Sentinel</text>
  <text x="48" y="96" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16">Verified safety companion — no black-box AI</text>
  <rect x="48" y="140" width="200" height="120" rx="14" fill="#152238" stroke="#334155"/>
  <text x="148" y="190" text-anchor="middle" fill="#5eead4" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">1. Location</text>
  <text x="148" y="220" text-anchor="middle" fill="#cbd5e1" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">lat / lon (rounded)</text>
  <path d="M260 200 H320" stroke="#5eead4" stroke-width="3"/><polygon points="320,200 308,194 308,206" fill="#5eead4"/>
  <rect x="330" y="140" width="220" height="120" rx="14" fill="#152238" stroke="#334155"/>
  <text x="440" y="185" text-anchor="middle" fill="#5eead4" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">2. AIMarket mesh</text>
  <text x="440" y="210" text-anchor="middle" fill="#cbd5e1" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">atlas.situation.brief</text>
  <text x="440" y="232" text-anchor="middle" fill="#cbd5e1" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">fire.weather · nearest</text>
  <path d="M560 200 H620" stroke="#5eead4" stroke-width="3"/><polygon points="620,200 608,194 608,206" fill="#5eead4"/>
