  <text x="770" y="210" text-anchor="middle" fill="#cbd5e1" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">deterministic thresholds</text>
  <text x="770" y="232" text-anchor="middle" fill="#cbd5e1" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">EMERGENCY / WARNING / CALM</text>
  <text x="480" y="320" text-anchor="middle" fill="#64748b" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">Built by AI-Factory · paid ATLAS capabilities via Hub escrow on Base</text>
