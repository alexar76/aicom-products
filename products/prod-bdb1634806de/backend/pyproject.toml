[project]
name = "sentinel"
version = "0.1.0"
description = "Sentinel Verified Safety Companion — LLM-free embeddable safety widget with signed evidence receipts"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "eth-account>=0.10.0",
    "eth-utils>=2.0.0",
    "httpx>=0.27.0",
    "cachetools>=5.3.0",
    "slowapi>=0.1.9",
    "apscheduler>=3.10.0",
    "openpyxl>=3.1.0",
    "aimarket-agent>=0.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27.0",
    "ruff>=0.3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing --cov-fail-under=60"
